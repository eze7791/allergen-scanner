services:
  - type: web
    name: allergen-scanner-api
    runtime: python
    plan: free
    buildCommand: >
      pip install -r requirements-deploy.txt &&
      cd frontend && npm install && npm run build
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
